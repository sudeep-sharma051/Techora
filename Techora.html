<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techora</title>
    <link rel="icon" type="image/png" href="images/Techora Logo.svg" />
    <link rel="stylesheet" href="Techora.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="container">
        <div class="header-items">
          <div class="logo">
            <img
              src="images/Techora Logo.svg"
              alt="Techora"
              width="60px"
              height="60px"
            />
            <span class="logo-name">Techora</span>
          </div>
          <div class="search">
            <ion-icon class="icon" name="search"></ion-icon>
            <input
              type="search"
              name="Search"
              id="Search"
              placeholder="Search for products"
            />
          </div>
          <nav>
            <a class="nav-links" href="#">Home</a>
            <a class="nav-links" href="#">About</a>
            <a class="nav-links" href="#">Products</a>
            <a class="nav-links" href="#">Contact</a>
          </nav>
          <div class="actions">
            <div class="icon-btn">
              <ion-icon class="icon icon-a" name="moon-outline"></ion-icon>
              <ion-icon class="icon icon-b" name="moon"></ion-icon>
            </div>

            <button>Sign up</button>
          </div>
        </div>
      </div>
    </header>
    <!-- Main -->
    <main>
      <!-- Carousel Section -->
      <section id="Carousel-Section">
        <div class="container">
          <div class="carousel-item" id="carousel">
            <div class="slide is-active" data-color="#4f7dff">
              <img
                src="images/Artboard-1.png"
                alt="Slide 1"
                draggable="false"
              />
            </div>
            <div class="slide" data-color="#a855f7">
              <img
                src="images/Artboard-2.png"
                alt="Slide 2"
                draggable="false"
              />
            </div>
            <div class="slide" data-color="#22d3c9">
              <img
                src="images/Artboard-3.png"
                alt="Slide 3"
                draggable="false"
              />
            </div>
            <div class="slide" data-color="#f5a524">
              <img
                src="images/Artboard-4.png"
                alt="Slide 4"
                draggable="false"
              />
            </div>
            <div class="slide" data-color="#fb7185">
              <img
                src="images/Artboard-5.png"
                alt="Slide 5"
                draggable="false"
              />
            </div>

            <button class="arrow prev" id="prevBtn" aria-label="Previous slide">
              <ion-icon class="arrows" name="chevron-back-outline"></ion-icon>
            </button>
            <button class="arrow next" id="nextBtn" aria-label="Next slide">
              <ion-icon
                class="arrows"
                name="chevron-forward-outline"
              ></ion-icon>
            </button>

            <div class="dots" id="dots"></div>
          </div>
        </div>
      </section>

      <!-- Featured Categories -->
      <section id="Featured-Categories-Section">
        <div class="container">
          <div class="featured-items">
            <div class="section-heading">
              <h2>Featured Categories</h2>
              <a href="#">View All</a>
            </div>

            <div class="categories-cards">
              <a href="#" class="category-card">
                <div class="category-image">
                  <img src="images/categories/keyboard.png" alt="Keyboards" />
                </div>
                <div class="category-info">
                  <h3>Keyboards</h3>
                  <p>14 Products</p>
                </div>
              </a>

              <a href="#" class="category-card">
                <div class="category-image">
                  <img src="images/categories/mouse.png" alt="Mouse" />
                </div>
                <div class="category-info">
                  <h3>Mouse</h3>
                  <p>16 Products</p>
                </div>
              </a>

              <a href="#" class="category-card">
                <div class="category-image">
                  <img src="images/categories/gamepad.png" alt="Controlers" />
                </div>
                <div class="category-info">
                  <h3>Controlers</h3>
                  <p>6 Products</p>
                </div>
              </a>

              <a href="#" class="category-card">
                <div class="category-image">
                  <img
                    src="images/categories/headset.png"
                    alt="Gaming Headphones"
                  />
                </div>
                <div class="category-info">
                  <h3>Headset</h3>
                  <p>10 Products</p>
                </div>
              </a>

              <a href="#" class="category-card">
                <div class="category-image">
                  <img
                    src="images/categories/gaming-chair.png"
                    alt="Gaming Chair"
                  />
                </div>
                <div class="category-info">
                  <h3>Gaming Chair</h3>
                  <p>6 Products</p>
                </div>
              </a>

              <a href="#" class="category-card">
                <div class="category-image">
                  <img src="images/categories/iem.png" alt="IEM" />
                </div>
                <div class="category-info">
                  <h3>IEM</h3>
                  <p>4 Products</p>
                </div>
              </a>

              <a href="#" class="category-card">
                <div class="category-image">
                  <img
                    src="images/categories/gaming-desk.png"
                    alt="Gaming Desk"
                  />
                </div>
                <div class="category-info">
                  <h3>Gaming Desk</h3>
                  <p>8 Products</p>
                </div>
              </a>

              <a href="#" class="category-card">
                <div class="category-image">
                  <img
                    src="images/categories/gaming-chair.png"
                    alt="Gaming Chair"
                  />
                </div>
                <div class="category-info">
                  <h3>Gaming Chair</h3>
                  <p>12 Products</p>
                </div>
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="Techora.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
