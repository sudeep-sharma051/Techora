<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techora</title>
    <link rel="stylesheet" href="Techora.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header-items">
          <div class="logo">
            <img
              src="images/Techora Logo.svg"
              alt="Techora"
              width="60px"
              height="60px"
            />Techora
          </div>
          <div class="search">
            <ion-icon class="icon" name="search"></ion-icon>
            <input
              type="search"
              name="Search"
              id="Search"
              placeholder="Search for products"
            />
          </div>
          <nav>
            <a class="nav-links" href="#">Home</a>
            <a class="nav-links" href="#">About</a>
            <a class="nav-links" href="#">Products</a>
            <a class="nav-links" href="#">Contact</a>
          </nav>
          <div class="actions">
            <div class="icon-btn">
              <ion-icon class="icon icon-a" name="moon-outline"></ion-icon>
              <ion-icon class="icon icon-b" name="moon"></ion-icon>
            </div>
            <button>Sign up</button>
          </div>
        </div>
      </div>
    </header>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
